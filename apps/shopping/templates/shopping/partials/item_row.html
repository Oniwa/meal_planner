<tr id="item-{{ item.id }}" class="border-b border-gray-100 {% if item.is_checked %}opacity-50{% endif %}">
  <td class="py-2 pr-4">
    <button
      class="flex items-center gap-2 text-left w-full"
      hx-post="{% url 'shopping_check' %}"
      hx-vals='{"item_id": "{{ item.id }}"}'
      hx-target="#item-{{ item.id }}"
      hx-swap="outerHTML"
    >
      <span class="w-5 h-5 border-2 rounded flex items-center justify-center flex-shrink-0 {% if item.is_checked %}bg-green-500 border-green-500{% else %}border-gray-300{% endif %}">
        {% if item.is_checked %}
          <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
          </svg>
        {% endif %}
      </span>
      <span class="{% if item.is_checked %}line-through text-gray-400{% else %}text-gray-800{% endif %}">
        {{ item.ingredient_name }}
      </span>
    </button>
  </td>
  <td class="py-2 text-sm text-gray-600">
    {{ item.total_quantity|floatformat:2 }} {{ item.unit }}
  </td>
  <td class="py-2 text-sm text-gray-400">
    {% if item.notes %}{{ item.notes }}{% endif %}
  </td>
</tr>
